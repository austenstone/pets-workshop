name: Deploy workshop guide

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/deploy-workshop-guide.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: workshop-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'austenstone/pets-workshop'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-slim
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload workshop guide
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy workshop guide
        id: deployment
        uses: actions/deploy-pages@v5
